<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're Offline — DELRON AI POS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      text-align: center;
      padding: 2rem;
    }
    .logo {
      width: 64px; height: 64px;
      background: #3b82f6;
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 900; color: #fff;
      margin: 0 auto;
    }
    h1 { font-size: 1.75rem; font-weight: 800; color: #f1f5f9; }
    p  { font-size: 1rem; color: #94a3b8; max-width: 360px; line-height: 1.6; }
    .badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 14px;
      background: #f59e0b22;
      border: 1px solid #f59e0b44;
      border-radius: 999px;
      font-size: 0.8rem; font-weight: 600; color: #fbbf24;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #f59e0b;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
    }
    button {
      margin-top: 0.5rem;
      padding: 10px 24px;
      background: #3b82f6;
      color: #fff;
      border: none; border-radius: 12px;
      font-size: 0.9rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s;
    }
    button:hover { background: #2563eb; }
    footer { position: fixed; bottom: 1rem; font-size: 0.75rem; color: #334155; }
  </style>
</head>
<body>
  <div class="logo">D</div>
  <div class="badge"><span class="dot"></span> No internet connection</div>
  <h1>You're Offline</h1>
  <p>
    DELRON AI POS needs a connection to load.<br />
    Check your Wi-Fi or mobile data and try again.
  </p>
  <button onclick="window.location.reload()">Try Again</button>
  <footer>DELRON AI POS · Built for Rwanda</footer>
</body>
</html>
